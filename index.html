<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>芒果的学习小屋</title>
<style>
/* ========== 基础重置 & 变量 ========== */
:root {
  --primary: #EC6EA0;
  --primary-light: #F8A5C2;
  --primary-dark: #C94F85;
  --primary-bg: #FCE4EC;
  --accent: #F06292;
  --accent-light: #F8BBD0;
  --danger: #EF5350;
  --soil: #D8A0B4;
  --soil-dark: #B07A90;
  --sky: #F8BBD0;
  --sky-light: #FCE4EC;
  --sun: #FFD8E4;
  --text: #8E2D5C;
  --text-2: #B0618C;
  --text-3: #C9A0B5;
  --bg: #FFF0F5;
  --card: #FFFFFF;
  --border: #FCE4EC;
  --shadow: 0 2px 8px rgba(236,110,160,0.10);
  --shadow-lg: 0 6px 20px rgba(236,110,160,0.18);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  /* 字体分层：楷体(标题点缀) / 宋体(正文) / 雅黑(小字数字) */
  --font-display: '楷体', 'KaiTi', 'STKaiti', 'KaiTi_GB2312', serif;
  --font-body: '宋体', 'SimSun', 'Songti SC', 'NSimSun', serif;
  --font-ui: '微软雅黑', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  font-family: var(--font-body);
  background: linear-gradient(160deg, #F8C8DC, #FFF0F5);
  min-height: 100vh;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
input, button { font-family: inherit; outline: none; border: none; }
button { cursor: pointer; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ========== App 容器 ========== */
#app {
  max-width: 430px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,0.06);
  overflow: hidden;
}

/* ========== 顶部栏 ========== */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px 8px;
  background: linear-gradient(120deg, #EC6EA0, #E873B8, #C94F85, #EC6EA0);
  background-size: 300% 300%;
  animation: barFlow 8s ease infinite;
  color: #fff;
  flex-shrink: 0;
  z-index: 10;
}
@keyframes barFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.header-left { display: flex; align-items: center; gap: 8px; }
.app-logo {
  font-size: 22px;
  display: inline-block;
  animation: logoSway 3s ease-in-out infinite;
  transform-origin: bottom center;
}
@keyframes logoSway {
  0%, 100% { transform: rotate(-8deg) scale(1); }
  50% { transform: rotate(8deg) scale(1.08); }
}
.app-name { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.date-text { font-size: 12px; opacity: 0.85; }
.streak-badge {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,0.2);
  padding: 4px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
  animation: badgeGlow 2.5s ease-in-out infinite;
}
@keyframes badgeGlow {
  0%, 100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
  50% { box-shadow: 0 0 12px rgba(255,255,255,0.5); }
}
.streak-badge .flame {
  font-size: 14px;
  display: inline-block;
  animation: flicker 0.9s ease-in-out infinite;
}
@keyframes flicker {
  0%, 100% { transform: scale(1) rotate(-3deg); }
  50% { transform: scale(1.2) rotate(3deg); }
}

/* ========== 飘落樱花 ========== */
.petal-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 4;
}
.petal {
  position: absolute;
  top: -30px;
  font-size: 14px;
  opacity: 0;
  animation: petalFall linear forwards;
  will-change: transform, top;
}
@keyframes petalFall {
  0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
  8% { opacity: 0.85; }
  50% { transform: translate(-18px, 45vh) rotate(180deg); }
  90% { opacity: 0.7; }
  100% { opacity: 0; transform: translate(14px, 92vh) rotate(360deg); }
}

/* ========== 树展示区 ========== */
.tree-hero {
  position: relative;
  background: linear-gradient(180deg, #FFE3F0 0%, #FFF0F6 50%, #FFF7FB 100%);
  padding-bottom: 0;
  flex-shrink: 0;
  overflow: hidden;
}
/* 左右布局：树居左，小知识/诗词居右 */
.hero-row {
  display: flex;
  gap: 10px;
  padding: 8px 16px 0;
  align-items: stretch;
  position: relative;
  z-index: 1;
}
.tree-col {
  flex: 0 0 38%;
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 0;
}
.hero-side {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  justify-content: center;
}
.tree-svg-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  position: relative;
  padding: 0;
}
.tree-svg-wrap img {
  width: 100%;
  max-width: 140px;
  display: block;
  object-fit: contain;
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
  animation: treeFadeIn 0.5s ease-out, treeSway 4.5s ease-in-out 0.5s infinite;
  transform-origin: 50% 90%;
}
@keyframes treeFadeIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes treeSway {
  0%, 100% { transform: rotate(-0.8deg) translateY(0); }
  50% { transform: rotate(0.8deg) translateY(-2px); }
}
/* 展示区光晕 */
.tree-hero::before {
  content: '';
  position: absolute;
  top: -20px; left: 19%;
  width: 200px; height: 200px;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(248,165,194,0.35), transparent 65%);
  animation: haloPulse 5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes haloPulse {
  0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
  50% { opacity: 0.9; transform: translateX(-50%) scale(1.12); }
}
.tree-hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.04));
}

/* 浮动积分提示 */
.float-points {
  position: absolute;
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 2px 8px rgba(240,98,146,0.4);
  pointer-events: none;
  animation: floatUp 1.2s ease-out forwards;
  z-index: 5;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  20% { transform: translateY(-10px) scale(1.2); opacity: 1; }
  100% { transform: translateY(-80px) scale(1); opacity: 0; }
}

/* ========== 阶段信息 & 进度条 ========== */
.stage-info {
  padding: 8px 20px 14px;
  background: linear-gradient(180deg, #FFF7FB, var(--bg));
}
.stage-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.stage-emoji {
  font-size: 20px;
  display: inline-block;
  animation: logoSway 3.5s ease-in-out infinite;
  transform-origin: bottom center;
}
.stage-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}
.stage-level {
  font-size: 12px;
  color: var(--text-3);
  margin-left: auto;
}
.progress-track {
  height: 10px;
  background: #F3D9E4;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-light), var(--primary));
  border-radius: 6px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  overflow: hidden;
}
.progress-fill::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 2s infinite;
}
@keyframes shimmer { 100% { left: 100%; } }
.progress-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-3);
}
.progress-current { font-weight: 600; color: var(--text-2); }
.progress-next { color: var(--text-3); }

/* ========== 每日小知识 ========== */
.daily-tip {
  margin: 0;
  padding: 10px 12px;
  background: linear-gradient(135deg, #FFF0F6, #FCE4EC);
  border-radius: var(--radius-sm);
  border: 1px dashed var(--primary-light);
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex-shrink: 0;
  animation: slideIn 0.4s ease-out;
  transition: transform 0.25s, box-shadow 0.25s;
}
.daily-tip:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.tip-icon {
  font-size: 20px;
  flex-shrink: 0;
  display: inline-block;
  animation: iconFloat 3s ease-in-out infinite;
}
.tip-body { flex: 1; min-width: 0; }
.tip-title {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tip-text {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--text);
  line-height: 1.7;
}

/* ========== 每日诗词 ========== */
.daily-poem {
  padding: 10px 12px;
  background: linear-gradient(135deg, #FBF3FF, #F3E8FA);
  border-radius: var(--radius-sm);
  border: 1px dashed #C9A6E0;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex-shrink: 0;
  animation: slideIn 0.4s ease-out 0.1s backwards;
  transition: transform 0.25s, box-shadow 0.25s;
}
.daily-poem:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.poem-icon {
  font-size: 20px;
  flex-shrink: 0;
  display: inline-block;
  animation: iconFloat 3.4s ease-in-out infinite;
}
.poem-body { flex: 1; min-width: 0; }
.poem-title {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 700;
  color: #8E5FC0;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 2px;
}
.poem-text {
  font-family: var(--font-display);
  font-size: 14px;
  color: #6B4A8E;
  line-height: 1.7;
}

/* ========== 统计卡片 ========== */
.stats-cards {
  display: flex;
  gap: 8px;
  padding: 12px 16px 6px;
  flex-shrink: 0;
}
.stat-card {
  flex: 1;
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 10px 8px;
  text-align: center;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s, box-shadow 0.25s;
  animation: cardIn 0.5s ease-out backwards;
}
.stat-card:nth-child(1) { animation-delay: 0.05s; }
.stat-card:nth-child(2) { animation-delay: 0.15s; }
.stat-card:nth-child(3) { animation-delay: 0.25s; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px) scale(0.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.stat-card:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: var(--shadow-lg);
}
.stat-card:active { transform: scale(0.96); }
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.stat-card.growth::before { background: var(--primary); }
.stat-card.available::before { background: var(--accent); }
.stat-card.total::before { background: #B48AE8; }
.stat-icon { font-size: 16px; }
.stat-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
  display: inline-block;
}
.stat-value.bump { animation: valueBump 0.45s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes valueBump {
  0% { transform: scale(1); }
  45% { transform: scale(1.35); }
  100% { transform: scale(1); }
}
.stat-card.growth .stat-value { color: var(--primary-dark); }
.stat-card.available .stat-value { color: var(--accent); }
.stat-card.total .stat-value { color: #8E5FC0; }
.stat-label { font-size: 10px; color: var(--text-3); }

/* ========== 成长之路 ========== */
.stage-roadmap {
  padding: 4px 16px 8px;
  flex-shrink: 0;
}
.roadmap-track {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 2px;
  scroll-behavior: smooth;
}
.roadmap-stage {
  min-width: 58px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px;
  border-radius: var(--radius-xs);
  background: #F5F5F5;
  transition: all 0.3s;
  flex-shrink: 0;
}
.roadmap-stage.completed {
  background: var(--primary-bg);
  opacity: 0.6;
}
.roadmap-stage.current {
  background: linear-gradient(135deg, #FCE4EC, #F8BBD0);
  box-shadow: 0 2px 8px rgba(240,98,146,0.4);
  transform: scale(1.08);
  animation: stagePulse 2s ease-in-out infinite;
}
@keyframes stagePulse {
  0%, 100% { transform: scale(1.08); box-shadow: 0 2px 8px rgba(240,98,146,0.4); }
  50% { transform: scale(1.13); box-shadow: 0 4px 14px rgba(240,98,146,0.55); }
}
.roadmap-stage.locked {
  opacity: 0.4;
}
.rm-emoji { font-size: 18px; }
.rm-name { font-size: 9px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
.rm-points { font-size: 8px; color: var(--text-3); }
.roadmap-stage.current .rm-name { color: var(--text); }

/* ========== Tab 导航 ========== */
.tab-nav {
  display: flex;
  background: var(--card);
  margin: 4px 12px 0;
  border-radius: var(--radius-sm);
  padding: 4px;
  gap: 4px;
  box-shadow: var(--shadow);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 8px 4px;
  background: transparent;
  border-radius: var(--radius-xs);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  transition: all 0.25s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  position: relative;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 2px 6px rgba(236,110,160,0.35);
}
.tab-badge {
  display: inline-flex;
  min-width: 16px;
  height: 16px;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  border-radius: 8px;
  padding: 0 4px;
}
.tab-btn.active .tab-badge { background: rgba(255,255,255,0.3); }

/* ========== Tab 面板 ========== */
.tab-panel {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 80px;
  -webkit-overflow-scrolling: touch;
}
.tab-panel.active { display: block; animation: panelIn 0.35s cubic-bezier(0.4,0,0.2,1); }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.panel-title { font-size: 15px; font-weight: 700; color: var(--text); }
.add-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(236,110,160,0.35);
  transition: transform 0.15s;
}
.add-btn:active { transform: scale(0.95); }
.clear-btn {
  background: #FFEBEE;
  color: var(--danger);
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 600;
}
.reset-btn {
  background: var(--primary-bg);
  color: var(--primary-dark);
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 600;
}
.panel-actions { display: flex; gap: 8px; }

/* ========== 任务列表 ========== */
.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  transition: all 0.25s;
  animation: slideIn 0.3s ease-out;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.task-item.completed { opacity: 0.55; }
.task-item.completed .task-name { text-decoration: line-through; }
.task-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.task-check {
  width: 24px; height: 24px;
  border: 2px solid var(--primary-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s;
  flex-shrink: 0;
  position: relative;
}
.task-check.checked {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-color: var(--primary);
  animation: checkPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes checkPop {
  0% { transform: scale(0.6); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.task-check:hover { border-color: var(--primary); transform: scale(1.1); }
.task-check svg {
  width: 14px; height: 14px;
  opacity: 0;
  transition: opacity 0.2s;
}
.task-check.checked svg { opacity: 1; }
.task-cat-icon { font-size: 18px; flex-shrink: 0; }
.task-info { flex: 1; min-width: 0; }
.task-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-meta { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.task-points {
  font-size: 14px;
  font-weight: 800;
  color: var(--accent);
  flex-shrink: 0;
}
.task-delete {
  width: 26px; height: 26px;
  background: var(--primary-bg);
  color: var(--primary);
  font-size: 13px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  opacity: 1;
}
.task-delete:hover { background: #FFEBEE; color: var(--danger); }

/* ========== 愿望列表 ========== */
.wish-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  animation: slideIn 0.3s ease-out;
  transition: transform 0.25s, box-shadow 0.25s;
}
.wish-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.wish-icon {
  font-size: 20px;
  flex-shrink: 0;
  display: inline-block;
  animation: iconFloat 3s ease-in-out infinite;
}
@keyframes iconFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.wish-info { flex: 1; min-width: 0; }
.wish-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.wish-cost {
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  margin-top: 2px;
}
.wish-redeem {
  padding: 6px 14px;
  background: linear-gradient(135deg, var(--primary-light), var(--primary));
  color: #fff;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(240,98,146,0.35);
  transition: transform 0.15s;
}
.wish-redeem:active { transform: scale(0.95); }
.wish-redeem.disabled {
  background: #E0E0E0;
  color: #BDBDBD;
  box-shadow: none;
  cursor: not-allowed;
}
.wish-redeem.done {
  background: var(--primary-bg);
  color: var(--primary-dark);
  box-shadow: none;
}
.wish-delete {
  width: 24px; height: 24px;
  background: transparent;
  color: var(--text-3);
  font-size: 14px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.wish-delete:hover { background: #FFEBEE; color: var(--danger); }

.redeemed-section { margin-top: 16px; }
.redeemed-section h3 {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 8px;
  padding-left: 4px;
}
.redeemed-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #FAFAFA;
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  opacity: 0.7;
}
.redeemed-item .wish-name { text-decoration: line-through; }
.redeemed-time { font-size: 10px; color: var(--text-3); }

/* ========== 历史记录 ========== */
.history-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  box-shadow: var(--shadow);
  animation: slideIn 0.3s ease-out backwards;
}
.history-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.history-icon.task { background: var(--primary-bg); }
.history-icon.wish { background: var(--accent-light); }
.history-icon.add { background: #E3F2FD; }
.history-icon.delete { background: #FFEBEE; }
.history-info { flex: 1; }
.history-desc { font-size: 13px; color: var(--text); }
.history-time { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.history-points {
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.history-points.plus { color: var(--primary); }
.history-points.minus { color: var(--danger); }

/* ========== 日历 ========== */
.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cal-month-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--primary-bg);
  color: var(--primary-dark);
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  box-shadow: var(--shadow);
}
.cal-month-btn:active { transform: scale(0.9); }
.calendar-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 6px;
}
.calendar-weekdays span {
  text-align: center;
  font-size: 11px;
  color: var(--text-3);
  padding: 4px 0;
}
.calendar-weekdays span:first-child,
.calendar-weekdays span:last-child { color: var(--accent); }
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.cal-cell {
  min-height: 54px;
  background: var(--card);
  border-radius: var(--radius-xs);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  animation: cellIn 0.3s ease-out backwards;
}
@keyframes cellIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}
.cal-cell:hover { transform: scale(1.06); box-shadow: var(--shadow-lg); }
.cal-cell:active { transform: scale(0.92); }
.cal-empty { background: transparent; box-shadow: none; cursor: default; }
.cal-day { font-size: 13px; font-weight: 700; color: var(--text); }
.cal-pts { font-size: 9px; font-weight: 700; line-height: 1; }
.cal-plus { color: var(--primary); }
.cal-minus { color: var(--danger); }
.cal-zero { color: var(--text-3); }
.cal-today {
  border: 2px solid var(--primary);
  box-shadow: 0 0 0 2px var(--primary-bg), var(--shadow);
}
.cal-selected {
  background: var(--primary-bg);
  box-shadow: 0 0 0 2px var(--primary-light);
}
.calendar-detail { margin-top: 14px; }
.cal-detail-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
  margin-bottom: 8px;
  padding-left: 4px;
}
.cal-detail-total {
  margin-top: 10px;
  text-align: right;
  font-size: 13px;
  color: var(--text-2);
  font-weight: 600;
  padding-right: 4px;
}
.cal-detail-total b { font-size: 15px; }

/* ========== 空状态 ========== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-3);
}
.empty-state .emoji { font-size: 40px; margin-bottom: 8px; }
.empty-state .text { font-size: 13px; }

/* ========== 底部信息 ========== */
.bottom-info {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  padding: 8px 16px;
  font-size: 10px;
  color: var(--text-3);
  text-align: center;
  border-top: 1px solid var(--border);
  z-index: 5;
}

/* ========== 模态框 ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(150,60,100,0.45);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s;
}
.modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: var(--card);
  width: 100%;
  max-width: 430px;
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 32px;
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 20px;
  text-align: center;
}
.modal-input {
  width: 100%;
  padding: 12px 16px;
  background: #F5F5F5;
  border-radius: var(--radius-sm);
  font-size: 15px;
  color: var(--text);
  margin-bottom: 16px;
}
.modal-input:focus { background: var(--primary-bg); }
.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.input-row label { font-size: 14px; color: var(--text-2); flex-shrink: 0; }
.number-input {
  display: flex;
  align-items: center;
  gap: 0;
  background: #F5F5F5;
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.num-btn {
  width: 36px; height: 40px;
  background: transparent;
  font-size: 18px;
  color: var(--primary);
  font-weight: 700;
}
.num-btn:active { background: #E0E0E0; }
.number-input input {
  width: 60px;
  text-align: center;
  background: transparent;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  border: none;
}
.quick-points { display: flex; gap: 6px; flex: 1; }
.quick-pt {
  flex: 1;
  padding: 6px 0;
  background: #F5F5F5;
  border-radius: var(--radius-xs);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.quick-pt.active {
  background: var(--primary-bg);
  color: var(--primary-dark);
}

/* 分类选择器 */
.category-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.cat-btn {
  padding: 8px 14px;
  background: #F5F5F5;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  transition: all 0.2s;
}
.cat-btn.active {
  background: var(--primary-bg);
  color: var(--primary-dark);
  box-shadow: 0 1px 4px rgba(236,110,160,0.25);
}

.modal-actions {
  display: flex;
  gap: 12px;
}
.btn-cancel, .btn-confirm {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  transition: transform 0.15s;
}
.btn-cancel {
  background: #F5F5F5;
  color: var(--text-3);
}
.btn-confirm {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 2px 8px rgba(236,110,160,0.35);
}
.btn-cancel:active, .btn-confirm:active { transform: scale(0.97); }

/* ========== 庆祝弹窗 ========== */
.celebration-overlay {
  position: fixed;
  inset: 0;
  background: rgba(150,60,100,0.5);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}
.celebration-overlay.show { display: flex; animation: fadeIn 0.3s; }
.celebration-box {
  background: var(--card);
  border-radius: 24px;
  padding: 32px 28px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
  overflow: hidden;
}
@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.celebration-box::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(240,98,146,0.18), transparent 60%);
  pointer-events: none;
}
.celebration-emoji {
  font-size: 48px;
  margin-bottom: 8px;
  animation: bounce 0.6s ease-out;
}
@keyframes bounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.celebration-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}
.celebration-msg {
  font-size: 14px;
  color: var(--text-2);
  margin-bottom: 20px;
  line-height: 1.5;
}
.celebration-btn {
  padding: 10px 32px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border-radius: 20px;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 3px 10px rgba(236,110,160,0.45);
}

/* 撒花动画 */
.confetti-piece {
  position: fixed;
  width: 8px; height: 8px;
  top: -10px;
  z-index: 201;
  animation: confettiFall linear forwards;
  pointer-events: none;
}
@keyframes confettiFall {
  to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ========== 确认弹窗 ========== */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(150,60,100,0.45);
  z-index: 150;
  display: none;
  align-items: center;
  justify-content: center;
}
.confirm-overlay.show { display: flex; animation: fadeIn 0.2s; }
.confirm-box {
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  max-width: 300px;
  width: 85%;
  text-align: center;
  animation: popIn 0.3s;
}
.confirm-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.confirm-msg { font-size: 13px; color: var(--text-2); margin-bottom: 20px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions button {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
}
.btn-no { background: #F5F5F5; color: var(--text-3); }
.btn-yes { background: linear-gradient(135deg, var(--primary-light), var(--primary)); color: #fff; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(170,70,115,0.92);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 300;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== 字体分层（古风排版） ========== */
/* 楷体：标题与点缀，笔意舒展 */
.app-name, .stage-name, .panel-title, .modal-title,
.celebration-title, .tab-btn, .bottom-info {
  font-family: var(--font-display);
}
/* 宋体正文：正文内容保持古籍书卷气（继承 body，无需重设） */
/* 雅黑：小字、数字与操作件，小字号下笔画清晰 */
.date-text, .stat-label, .stat-value, .task-meta, .task-points,
.rm-name, .rm-points, .history-time, .redeemed-time, .cal-day,
.cal-pts, .cal-head span, .cal-month-label, .tip-index, .streak-badge,
.add-btn, .clear-btn, .reset-btn, .wish-redeem, .wish-cost,
.btn-cancel, .btn-confirm, .btn-no, .btn-yes, .celebration-btn,
.toast, .progress-current, .progress-next, .modal-input {
  font-family: var(--font-ui);
}
/* 楷体标题适当放大字距，更接近匾额排版 */
.app-name { letter-spacing: 3px; }
.panel-title { letter-spacing: 2px; }
</style>
</head>
<body>
<div id="app">
  <!-- 飘落樱花层 -->
  <div class="petal-layer" id="petalLayer"></div>
  <!-- 顶部栏 -->
  <header class="top-bar">
    <div class="header-left">
      <span class="app-logo">🌸</span>
      <span class="app-name">芒果的学习小屋</span>
    </div>
    <div class="header-right">
      <span class="date-text" id="dateText"></span>
      <div class="streak-badge">
        <span class="flame">🔥</span>
        <span id="streakNum">0</span>
        <span>天</span>
      </div>
    </div>
  </header>

  <!-- 树展示区（左树 + 右侧每日小知识/每日诗词） -->
  <section class="tree-hero">
    <div class="hero-row">
      <div class="tree-col">
        <div class="tree-svg-wrap" id="treeSvgWrap"></div>
      </div>
      <div class="hero-side">
        <section class="daily-tip" id="dailyTip">
          <span class="tip-icon">💡</span>
          <div class="tip-body">
            <div class="tip-title">每日小知识</div>
            <div class="tip-text" id="tipText">加载中…</div>
          </div>
        </section>
        <section class="daily-poem" id="dailyPoem">
          <span class="poem-icon">📜</span>
          <div class="poem-body">
            <div class="poem-title">每日诗词</div>
            <div class="poem-text" id="poemText">加载中…</div>
          </div>
        </section>
      </div>
    </div>
    <div class="stage-info">
      <div class="stage-badge">
        <span class="stage-emoji" id="stageEmoji">🌰</span>
        <span class="stage-name" id="stageName">种子</span>
        <span class="stage-level" id="stageLevel">阶段 1/10</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>

  </section>

  <!-- 统计卡片 -->
  <section class="stats-cards">
    <div class="stat-card growth">
      <span class="stat-icon">🌱</span>
      <span class="stat-value" id="growthValue">0</span>
      <span class="stat-label">成长积分</span>
    </div>
    <div class="stat-card available">
      <span class="stat-icon">⭐</span>
      <span class="stat-value" id="availableValue">0</span>
      <span class="stat-label">可用积分</span>
    </div>
    <div class="stat-card total">
      <span class="stat-icon">📈</span>
      <span class="stat-value" id="totalValue">0</span>
      <span class="stat-label">累计获得</span>
    </div>
  </section>

  <!-- 成长之路 -->
  <section class="stage-roadmap">
    <div class="roadmap-track" id="roadmapTrack"></div>
  </section>

  <!-- Tab 导航 -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="tasks">
      📋 今日任务
      <span class="tab-badge" id="taskBadge">0</span>
    </button>
    <button class="tab-btn" data-tab="wishes">
      🎁 积分兑换
      <span class="tab-badge" id="wishBadge">0</span>
    </button>
    <button class="tab-btn" data-tab="history">
      📖 成长历程
    </button>
    <button class="tab-btn" data-tab="calendar">
      📅 日历
    </button>
  </nav>

  <!-- 任务面板 -->
  <section class="tab-panel active" id="tasksPanel">
    <div class="panel-header">
      <span class="panel-title">今日任务</span>
      <button class="add-btn" id="openAddTask">＋ 添加任务</button>
    </div>
    <div id="taskList"></div>
  </section>

  <!-- 愿望面板 -->
  <section class="tab-panel" id="wishesPanel">
    <div class="panel-header">
      <span class="panel-title">积分兑换</span>
      <button class="add-btn" id="openAddWish">＋ 添加愿望</button>
    </div>
    <div id="wishList"></div>
    <div class="redeemed-section" id="redeemedSection" style="display:none">
      <h3>✅ 已兑换</h3>
      <div id="redeemedList"></div>
    </div>
  </section>

  <!-- 历史面板 -->
  <section class="tab-panel" id="historyPanel">
    <div class="panel-header">
      <span class="panel-title">成长历程</span>
      <div class="panel-actions">
        <button class="clear-btn" id="clearHistory">清空记录</button>
        <button class="reset-btn" id="resetAll">重置数据</button>
      </div>
    </div>
    <div id="historyList"></div>
  </section>

  <!-- 日历面板 -->
  <section class="tab-panel" id="calendarPanel">
    <div class="calendar-header">
      <button class="cal-month-btn" id="prevMonth">‹</button>
      <span class="calendar-title" id="calendarTitle">2026年8月</span>
      <button class="cal-month-btn" id="nextMonth">›</button>
    </div>
    <div class="calendar-weekdays">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="calendar-detail" id="calendarDetail"></div>
  </section>

  <!-- 底部提示 -->
  <div class="bottom-info">
    完成任务获得积分促进小树成长 · 兑换愿望消耗积分不影响已积累的成长值
  </div>
</div>

<!-- 添加任务模态框 -->
<div class="modal-overlay" id="addTaskModal">
  <div class="modal-content">
    <div class="modal-title">添加任务</div>
    <input type="text" class="modal-input" id="taskNameInput" placeholder="输入任务名称（如：背20个单词）" maxlength="20">
    <div class="input-row">
      <label>积分</label>
      <div class="number-input">
        <button class="num-btn" id="taskPtDec">−</button>
        <input type="number" id="taskPtInput" value="10" min="1" max="100">
        <button class="num-btn" id="taskPtInc">＋</button>

      <div class="quick-points">
        <button class="quick-pt" data-pt="5">5</button>
        <button class="quick-pt active" data-pt="10">10</button>
        <button class="quick-pt" data-pt="15">15</button>
        <button class="quick-pt" data-pt="20">20</button>
      </div>
    </div>
    <div class="category-picker" id="catPicker"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelTask">取消</button>
      <button class="btn-confirm" id="confirmTask">确认添加</button>
    </div>
  </div>
</div>

<!-- 添加愿望模态框 -->
<div class="modal-overlay" id="addWishModal">
  <div class="modal-content">
    <div class="modal-title">添加愿望</div>
    <input type="text" class="modal-input" id="wishNameInput" placeholder="输入愿望名称（如：看一集剧）" maxlength="20">
    <div class="input-row">
      <label>消耗</label>
      <div class="number-input">
        <button class="num-btn" id="wishCostDec">−</button>
        <input type="number" id="wishCostInput" value="30" min="1" max="9999">
        <button class="num-btn" id="wishCostInc">＋</button>
      </div>
      <div class="quick-points">
        <button class="quick-pt" data-cost="20">20</button>
        <button class="quick-pt active" data-cost="30">30</button>
        <button class="quick-pt" data-cost="50">50</button>
        <button class="quick-pt" data-cost="100">100</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelWish">取消</button>
      <button class="btn-confirm" id="confirmWish">确认添加</button>
    </div>
  </div>
</div>

<!-- 庆祝弹窗 -->
<div class="celebration-overlay" id="celebration">
  <div class="celebration-box">
    <div class="celebration-emoji" id="celeEmoji">🎉</div>
    <div class="celebration-title" id="celeTitle">恭喜升级！</div>
    <div class="celebration-msg" id="celeMsg">你的小树苗成长了！</div>

万里长征人未还。","但使龙城飞将在，不教胡马度阴山。","黄沙百战穿金甲，不破楼兰终不还。","青海长云暗雪山，孤城遥望玉门关。","羌笛何须怨杨柳，春风不度玉门关。","忽如一夜春风来，千树万树梨花开。","瀚海阑干百丈冰，愁云惨淡万里凝。","纷纷暮雪下辕门，风掣红旗冻不翻。","山回路转不见君，雪上空留马行处。","战士军前半死生，美人帐下犹歌舞。","大漠穷秋塞草腓，孤城落日斗兵稀。","莫愁前路无知己，天下谁人不识君。","丈夫贫贱应未足，今日相逢无酒钱。","空山新雨后，天气晚来秋。","明月松间照，清泉石上流。","竹喧归浣女，莲动下渔舟。","劝君更尽一杯酒，西出阳关无故人。","大漠孤烟直，长河落日圆。","征蓬出汉塞，归雁入胡天。","江流天地外，山色有无中。","月出惊山鸟，时鸣春涧中。","人闲桂花落，夜静春山空。","空山不见人，但闻人语响。","返景入深林，复照青苔上。","山路元无雨，空翠湿人衣。","海内存知己，天涯若比邻。","无为在歧路，儿女共沾巾。","阁中帝子今何在，槛外长江空自流。","落霞与孤鹜齐飞，秋水共长天一色。","老骥伏枥，志在千里。","烈士暮年，壮心不已。","周公吐哺，天下归心。","对酒当歌，人生几何。","譬如朝露，去日苦多。","青青子衿，悠悠我心。","山不厌高，海不厌深。","羁鸟恋旧林，池鱼思故渊。","久在樊笼里，复得返自然。","采菊东篱下，悠然见南山。","山气日夕佳，飞鸟相与还。","此中有真意，欲辨已忘言。","晨兴理荒秽，带月荷锄归。","衣沾不足惜，但使愿无违。","盛年不重来，一日难再晨。","及时当勉励，岁月不待人。","池塘生春草，园柳变鸣禽。","余霞散成绮，澄江静如练。","暮江平不动，春花满正开。","流波将月去，潮水带星来。","相去万余里，各在天一涯。","道路阻且长，会面安可知。","胡马依北风，越鸟巢南枝。","青青河畔草，郁郁园中柳。","涉江采芙蓉，兰泽多芳草。","采之欲遗谁，所思在远道。","还顾望旧乡，长路漫浩浩。","同心而离居，忧伤以终老。","行行重行行，与君生别离。","相去万余里，各在天一涯。","人生天地间，忽如远行客。","生年不满百，常怀千岁忧。","昼短苦夜长，何不秉烛游。","疾风知劲草，板荡识诚臣。","人事有代谢，往来成古今。","江山留胜迹，我辈复登临。","水落鱼梁浅，天寒梦泽深。","羊公碑尚在，读罢泪沾襟。","昔闻洞庭水，今上岳阳楼。","吴楚东南坼，乾坤日夜浮。","亲朋无一字，老病有孤舟。","戎马关山北，凭轩涕泗流。","气蒸云梦泽，波撼岳阳城。","欲济无舟楫，端居耻圣明。","坐观垂钓者，徒有羡鱼情。","草木本无意，荣枯自有时。","洛阳亲友如相问，一片冰心在玉壶。","秦时风俗尽，汉世礼仪疏。","投我以木桃，报之以琼瑶。","他山之石，可以攻玉。","高山仰止，景行行止。","靡不有初，鲜克有终。","一日不见，如三秋兮。","昔我往矣，杨柳依依。","今我来思，雨雪霏霏。","关关雎鸠，在河之洲。窈窕淑女，君子好逑。","桃之夭夭，灼灼其华。之子于归，宜其室家。","风雨如晦，鸡鸣不已。既见君子，云胡不喜。","执子之手，与子偕老。","知我者，谓我心忧；不知我者，谓我何求。","路漫漫其修远兮，吾将上下而求索。","亦余心之所善兮，虽九死其犹未悔。","长太息以掩涕兮，哀民生之多艰。","举世皆浊我独清，众人皆醉我独醒。","沧浪之水清兮，可以濯吾缨。","沧浪之水浊兮，可以濯吾足。","老吾老以及人之老，幼吾幼以及人之幼。","天时不如地利，地利不如人和。","得道者多助，失道者寡助。","生于忧患，而死于安乐。","富贵不能淫，贫贱不能移，威武不能屈。","鱼，我所欲也；熊掌，亦我所欲也。","二者不可得兼，舍鱼而取熊掌者也。","故天将降大任于是人也。","不以物喜，不以己悲。","居庙堂之高则忧其民，处江湖之远则忧其君。","先天下之忧而忧，后天下之乐而乐。","微斯人，吾谁与归。","亲贤臣，远小人，此先汉所以兴隆也。","苟全性命于乱世，不求闻达于诸侯。","受任于败军之际，奉命于危难之间。","鞠躬尽瘁，死而后已。","世有伯乐，然后有千里马。","千里马常有，而伯乐不常有。","师者，所以传道受业解惑也。","师不必贤于弟子，弟子不必不如师。","闻道有先后，术业有专攻。","古之学者必有师。师者，所以传道受业解惑也。","秦人不暇自哀，而后人哀之。","后人哀之而不鉴之，亦使后人而复哀后人也。","长桥卧波，未云何龙。复道行空，不霁何虹。","清风徐来，水波不兴。","诵明月之诗，歌窈窕之章。","浩浩乎如冯虚御风，而不知其所止。","飘飘乎如遗世独立，羽化而登仙。","寄蜉蝣于天地，渺沧海之一粟。","哀吾生之须臾，羡长江之无穷。","挟飞仙以遨游，抱明月而长终。","逝者如斯，而未尝往也。盈虚者如彼，而卒莫消长也。","盖将自其变者而观之，则天地曾不能以一瞬。","自其不变者而观之，则物与我皆无尽也。","鹏之徙于南冥也，水击三千里。","抟扶摇而上者九万里。","且夫水之积也不厚，则其负大舟也无力。","至人无己，神人无功，圣人无名。","君子博学而日参省乎己，则知明而行无过矣。","故不积跬步，无以至千里。","不积小流，无以成江海。","骐骥一跃，不能十步。驽马十驾，功在不舍。","锲而舍之，朽木不折。锲而不舍，金石可镂。","君子生非异也，善假于物也。","信誓旦旦，不思其反。反是不思，亦已焉哉。","于嗟女兮，无与士耽。士之耽兮，犹可说也。","女之耽兮，不可说也。","乘彼垝垣，以望复关。不见复关，泣涕涟涟。","既见复关，载笑载言。","总角之宴，言笑晏晏。信誓旦旦，不思其反。","高余冠之岌岌兮，长余佩之陆离。","芳与泽其杂糅兮，唯昭质其犹未亏。","民生各有所乐兮，余独好修以为常。","虽体解吾犹未变兮，岂余心之可惩。","步余马于兰皋兮，驰椒丘且焉止息。","进不入以离尤兮，退将复修吾初服。","汩余若将不及兮，恐年岁之不吾与。","日月忽其不淹兮，春与秋其代序。","惟草木之零落兮，恐美人之迟暮。","乘骐骥以驰骋兮，来吾道夫先路。","长揖雄谈态自殊，美人巨眼识穷途。","尸居余气杨公幕，岂得羁縻女丈夫。","凭栏一片风云气，来作神州袖手人。","拼将十万头颅血，须把乾坤力挽回。","何期小会幽欢，变作离情别绪。","泪眼问花花不语，乱红飞过秋千去。","人生自是有情痴，此恨不关风与月。","春风又绿江南岸，明月何时照我还。","不畏浮云遮望眼，自缘身在最高层。","一水护田将绿绕，两山排闼送青来。","青山缭绕疑无路，忽见千帆隐映来。","夜阑风静縠纹平，小舟从此逝，江海寄余生。","几时归去，作个闲人。对一张琴，一壶酒，一溪云。","愿我如星君如月，夜夜流光相皎洁。","少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。","而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。","江南游子，把吴钩看了，栏杆拍遍。","算只有殷勤，画檐蛛网，尽日惹飞絮。","若教眼底无离恨，不信人间有白头。","春心莫共花争发，一寸相思一寸灰。","直道相思了无益，未妨惆怅是清狂。","昨夜星辰昨夜风，画楼西畔桂堂东。","身无彩凤双飞翼，心有灵犀一点通。","秋阴不散霜飞晚，留得枯荷听雨声。","人世难逢开口笑，菊花须插满头归。","但将酩酊酬佳节，不用登临恨落晖。","尘世难逢开口笑，少年安得知。","劝君莫惜金缕衣，劝君惜取少年时。","花开堪折直须折，莫待无花空折枝。","海日生残夜，江春入旧年。","乡书何处达，归雁洛阳边。","潮平两岸阔，风正一帆悬。","孤雁不饮啄，飞鸣声念群。","谁怜一片影，相失万重云。","望尽似犹见，哀多如更闻。","野鸦无意绪，鸣噪自纷纷。","露重飞难进，风多响易沉。","无人信高洁，谁为表予心。","此地别燕丹，壮士发冲冠。","昔时人已没，今日水犹寒。","草木有本心，何求美人折。","江东子弟多才俊，卷土重来未可知。","东风夜放花千树，更吹落星如雨。","宝马雕车香满路，凤箫声动，玉壶光转，一夜鱼龙舞。","蛾儿雪柳黄金缕，笑语盈盈暗香去。","恨相见得迟，怨归去得疾。柳丝长玉骢难系。","碧云天，黄花地，西风紧，北雁南飞。","晓来谁染霜林醉，总是离人泪。","原来姹紫嫣红开遍，似这般都付与断井颓垣。","良辰美景奈何天，赏心乐事谁家院。","则为你如花美眷，似水流年。","滴不尽相思血泪抛红豆，开不完春柳春花满画楼。","睡不稳纱窗风雨黄昏后，忘不了新愁与旧愁。","都道是金玉良缘，俺只念木石前盟。","空对着山中高士晶莹雪，终不忘世外仙姝寂寞林。","开辟鸿蒙，谁为情种。都只为风月情浓。","孤标傲世偕谁隐，一样花开为底迟。","质本洁来还洁去，强于污淖陷渠沟。","一朝春尽红颜老，花落人亡两不知。","寒塘渡鹤影，冷月葬花魂。","身如菩提树，心似明镜台。","时时勤拂拭，勿使惹尘埃。","菩提本无树，明镜亦非台。","本来无一物，何处惹尘埃。","无可奈何，似曾相识。","春风桃李花开日，秋雨梧桐叶落时。","行宫见月伤心色，夜雨闻铃肠断声。","芙蓉如面柳如眉，对此如何不泪垂。","上穷碧落下黄泉，两处茫茫皆不见。","忽闻海上有仙山，山在虚无缥缈间。","楼阁玲珑五云起，其中绰约多仙子。","中有一人字太真，雪肤花貌参差是。","七月七日长生殿，夜半无人私语时。","在天愿作比翼鸟，在地愿为连理枝。","天长地久有时尽，此恨绵绵无绝期。","天接云涛连晓雾，星河欲转千帆舞。","仿佛梦魂归帝所，闻天语，殷勤问我归何处。","我报路长嗟日暮，学诗谩有惊人句。","九万里风鹏正举，风休住，蓬舟吹取三山去。","千古江山，英雄无觅孙仲谋处。","舞榭歌台，风流总被雨打风吹去。","斜阳草树，寻常巷陌，人道寄奴曾住。","想当年，金戈铁马，气吞万里如虎。","元嘉草草，封狼居胥，赢得仓皇北顾。","四十三年，望中犹记，烽火扬州路。","可堪回首，佛狸祠下，一片神鸦社鼓。","凭谁问，廉颇老矣，尚能饭否。","楚天千里清秋，水随天去秋无际。","遥岑远目，献愁供恨，玉簪螺髻。","落日楼头，断鸿声里，江南游子。","把吴钩看了，栏杆拍遍，无人会，登临意。","休说鲈鱼堪脍，尽西风，季鹰归未。","求田问舍，怕应羞见，刘郎才气。","可惜流年，忧愁风雨，树犹如此。","倩何人唤取，红巾翠袖，揾英雄泪。","少年听雨歌楼上，红烛昏罗帐。","壮年听雨客舟中，江阔云低，断雁叫西风。","而今听雨僧庐下，鬓已星星也。","悲欢离合总无情，一任阶前点滴到天明。","金陵城上西楼，倚清秋。万里夕阳垂地大江流。","中原乱，簪缨散，几时收。试倩悲风吹泪过扬州。","梦后楼台高锁，酒醒帘幕低垂。","去年春恨却来时，落花人独立，微雨燕双飞。","记得小苹初见，两重心字罗衣。","琵琶弦上说相思，当时明月在，曾照彩云归。","西城杨柳弄春柔，动离忧，泪难收。","犹记多情，曾为系归舟。","碧野朱桥当日事，人不见，水空流。","韶华不为少年留，恨悠悠，几时休。","飞絮落花时候一登楼。","便做春江都是泪，流不尽，许多愁。","雾浓云愁永昼，瑞脑销金兽。","佳节又重阳，玉枕纱厨，半夜凉初透。","东篱把酒黄昏后，有暗香盈袖。","莫道不销魂，帘卷西风，人比黄花瘦。","风住尘香花已尽，日晚倦梳头。","物是人非事事休，欲语泪先流。","闻说双溪春尚好，也拟泛轻舟。","只恐双溪舴艋舟，载不动许多愁。","寻寻觅觅，冷冷清清，凄凄惨惨戚戚。","乍暖还寒时候，最难将息。","三杯两盏淡酒，怎敌他晚来风急。","雁过也，正伤心，却是旧时相识。","满地黄花堆积，憔悴损，如今有谁堪摘。","守着窗儿，独自怎生得黑。","梧桐更兼细雨，到黄昏点点滴滴。","这次第，怎一个愁字了得。","怒发冲冠，凭栏处、潇潇雨歇。","抬望眼、仰天长啸，壮怀激烈。","三十功名尘与土，八千里路云和月。","莫等闲、白了少年头，空悲切。","靖康耻，犹未雪。臣子恨，何时灭。","驾长车，踏破贺兰山缺。","壮志饥餐胡虏肉，笑谈渴饮匈奴血。","待从头、收拾旧山河，朝天阙。","郁孤台下清江水，中间多少行人泪。","西北望长安，可怜无数山。","青山遮不住，毕竟东流去。","江晚正愁余，山深闻鹧鸪。","醉里挑灯看剑，梦回吹角连营。","八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。","马作的卢飞快，弓如霹雳弦惊。","了却君王天下事，赢得生前身后名。可怜白发生。","明月别枝惊鹊，清风半夜鸣蝉。","稻花香里说丰年，听取蛙声一片。","七八个星天外，两三点雨山前。","旧时茅店社林边，路转溪桥忽见。","千古兴亡多少事，悠悠，不尽长江滚滚流。","年少万兜鍪，坐断东南战未休。","天下英雄谁敌手，曹刘。生子当如孙仲谋。","少年不识愁滋味，爱上层楼。","爱上层楼，为赋新词强说愁。","而今识尽愁滋味，欲说还休。","欲说还休，却道天凉好个秋。","好风凭借力，送我上青云。","粉堕百花洲，香残燕子楼。","一团团逐对成球。漂泊亦如人命薄。","空缱绻，说风流。","草木也知愁，韶华竟白头。","叹今生，谁舍谁收。","嫁与东风春不管，凭尔去，忍淹留。","疏影横斜水清浅，暗香浮动月黄昏。","众芳摇落独暄妍，占尽风情向小园。","霜禽欲下先偷眼，粉蝶如知合断魂。","幸有微吟可相狎，不须檀板共金尊。","莫笑农家腊酒浑，丰年留客足鸡豚。","山重水复疑无路，柳暗花明又一村。","箫鼓追随春社近，衣冠简朴古风存。","从今若许闲乘月，拄杖无时夜叩门。","世味年来薄似纱，谁令骑马客京华。","小楼一夜听春雨，深巷明朝卖杏花。","矮纸斜行闲作草，晴窗细乳戏分茶。","素衣莫起风尘叹，犹及清明可到家。","死去元知万事空，但悲不见九州同。","王师北定中原日，家祭无忘告乃翁。","早岁那知世事艰，中原北望气如山。","楼船夜雪瓜洲渡，铁马秋风大散关。","塞上长城空自许，镜中衰鬓已先斑。","出师一表真名世，千载谁堪伯仲间。","僵卧孤村不自哀，尚思为国戍轮台。","夜阑卧听风吹雨，铁马冰河入梦来。","驿外断桥边，寂寞开无主。","已是黄昏独自愁，更着风和雨。","无意苦争春，一任群芳妒。","零落成泥碾作尘，只有香如故。","纸上得来终觉浅，绝知此事要躬行。","古人学问无遗力，少壮工夫老始成。","位卑未敢忘忧国，事定犹须待阖棺。","国仇未报壮士老，匣中宝剑夜有声。","梅须逊雪三分白，雪却输梅一段香。","生当作人杰，死亦为鬼雄。","至今思项羽，不肯过江东。","千古风流八咏楼，江山留与后人愁。","水通南国三千里，气压江城十四州。","千古凭高对此，谩嗟荣辱。","六朝旧事随流水，但寒烟衰草凝绿。","至今商女，时时犹唱，后庭遗曲。","登临送目，正故国晚秋，天气初肃。","千里澄江似练，翠峰如簇。","归帆去棹残阳里，背西风，酒旗斜矗。","彩舟云淡，星河鹭起，画图难足。","念往昔，繁华竞逐，叹门外楼头，悲恨相续。","元知造物心肠别，老却英雄似等闲。","我自横刀向天笑，去留肝胆两昆仑。","有心杀贼，无力回天，死得其所，快哉快哉。","一腔热血勤珍重，洒去犹能化碧涛。","拼将十万头颅血，须把乾坤力挽回。","苟利国家生死以，岂因祸福避趋之。","我劝天公重抖擞，不拘一格降人材。","浩荡离愁白日斜，吟鞭东指即天涯。","落红不是无情物，化作春泥更护花。","九州生气恃风雷，万马齐喑究可哀。","凭栏一片风云气，来作神州袖手人。","寸寸山河寸寸金，侉离分裂力谁任。","杜鹃再拜忧天泪，精卫无穷填海心。","四面歌残终破楚，八年风味徒思浙。","苦将侬强派作蛾眉，殊未屑。","身不得，男儿列，心却比，男儿烈。","算平生肝胆，因人常热。","俗子胸襟谁识我，英雄末路当磨折。","莽红尘何处觅知音，青衫湿。","一腔热血勤珍重，洒去犹能化碧涛。","不惜千金买宝刀，貂裘换酒也堪豪。","一腔热血勤珍重，洒去犹能化碧涛。","一腔热血勤珍重，洒去犹能化碧涛。","独立寒秋，湘江北去，橘子洲头。","看万山红遍，层林尽染；漫江碧透，百舸争流。","鹰击长空，鱼翔浅底，万类霜天竞自由。","怅寥廓，问苍茫大地，谁主沉浮。","携来百侣曾游，忆往昔峥嵘岁月稠。","恰同学少年，风华正茂；书生意气，挥斥方遒。","指点江山，激扬文字，粪土当年万户侯。","曾记否，到中流击水，浪遏飞舟。","才饮长沙水，又食武昌鱼。","万里长江横渡，极目楚天舒。","不管风吹浪打，胜似闲庭信步，今日得宽余。","子在川上曰，逝者如斯夫。","风樯动，龟蛇静，起宏图。","一桥飞架南北，天堑变通途。","更立西江石壁，截断巫山云雨，高峡出平湖。","神女应无恙，当惊世界殊。","风雨送春归，飞雪迎春到。","已是悬崖百丈冰，犹有花枝俏。","俏也不争春，只把春来报。","待到山花烂漫时，她在丛中笑。","红军不怕远征难，万水千山只等闲。","五岭逶迤腾细浪，乌蒙磅礴走泥丸。","金沙水拍云崖暖，大渡桥横铁索寒。","更喜岷山千里雪，三军过后尽开颜。","雄关漫道真如铁，而今迈步从头越。","从头越，苍山如海，残阳如血。","钟山风雨起苍黄，百万雄师过大江。","虎踞龙盘今胜昔，天翻地覆慨而慷。","宜将剩勇追穷寇，不可沽名学霸王。","天若有情天亦老，人间正道是沧桑。","横眉冷对千夫指，俯首甘为孺子牛。","寄意寒星荃不察，我以我血荐轩辕。","忍看朋辈成新鬼，怒向刀丛觅小诗。","心事浩茫连广宇，于无声处听惊雷。","度尽劫波兄弟在，相逢一笑泯恩仇。","岂有豪情似旧时，花开花落两由之。","无情未必真豪杰，怜子如何不丈夫。","血沃中原肥劲草，寒凝大地发春华。","梦绕神州路。怅秋风、连营画角，故宫离黍。","底事昆仑倾砥柱，九地黄流乱注。聚万落千村狐兔。","天意从来高难问，况人情老易悲难诉。更南浦，送君去。","凉生岸柳催残暑。耿斜河，疏星淡月，断云微度。","万里江山知何处。回首对床夜语。雁不到，书成谁与。","目尽青天怀今古，肯儿曹恩怨相尔汝。举大白，听金缕。","春归何处。寂寞无行路。若有人知春去处。唤取归来同住。","春无踪迹谁知。除非问取黄鹂。百啭无人能解，因风飞过蔷薇。","缺月挂疏桐，漏断人初静。","谁见幽人独往来，缥缈孤鸿影。","惊起却回头，有恨无人省。","拣尽寒枝不肯栖，寂寞沙洲冷。","细雨斜风作晓寒，淡烟疏柳媚晴滩。","入淮清洛渐漫漫。","雪沫乳花浮午盏，蓼茸蒿笋试春盘。","人间有味是清欢。","一别都门三改火，天涯踏尽红尘。","依然一笑作春温。","无波真古井，有节是秋筠。","惆怅孤帆连夜发，送行淡月微云。","尊前不用翠眉颦。","人生如逆旅，我亦是行人。","春宵一刻值千金，花有清香月有阴。","歌管楼台声细细，秋千院落夜沉沉。","人生到处知何似，应似飞鸿踏雪泥。","泥上偶然留指爪，鸿飞那复计东西。","老僧已死成新塔，坏壁无由见旧题。","往日崎岖还记否，路长人困蹇驴嘶。","粗缯大布裹生涯，腹有诗书气自华。","厌伴老儒烹瓠叶，强随举子踏槐花。","囊空不办寻春马，眼乱行看择婿车。","得意犹堪夸世俗，诏黄新湿字如鸦。","莫听穿林打叶声，何妨吟啸且徐行。","竹杖芒鞋轻胜马，谁怕，一蓑烟雨任平生。","料峭春风吹酒醒，微冷，山头斜照却相迎。","回首向来萧瑟处，归去，也无风雨也无晴。","夜饮东坡醒复醉，归来仿佛三更。","家童鼻息已雷鸣。敲门都不应，倚杖听江声。","长恨此身非我有，何时忘却营营。","夜阑风静縠纹平。小舟从此逝，江海寄余生。","明月几时有，把酒问青天。","不知天上宫阙，今夕是何年。","我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","起舞弄清影，何似在人间。","转朱阁，低绮户，照无眠。","不应有恨，何事长向别时圆。","人有悲欢离合，月有阴晴圆缺，此事古难全。","但愿人长久，千里共婵娟。","大江东去，浪淘尽，千古风流人物。","故垒西边，人道是，三国周郎赤壁。","乱石穿空，惊涛拍岸，卷起千堆雪。","江山如画，一时多少豪杰。","遥想公瑾当年，小乔初嫁了，雄姿英发。","羽扇纶巾，谈笑间，樯橹灰飞烟灭。","故国神游，多情应笑我，早生华发。","人生如梦，一尊还酹江月。","老夫聊发少年狂，左牵黄，右擎苍。","锦帽貂裘，千骑卷平冈。","为报倾城随太守，亲射虎，看孙郎。","酒酣胸胆尚开张，鬓微霜，又何妨。","持节云中，何日遣冯唐。","会挽雕弓如满月，西北望，射天狼。","十年生死两茫茫，不思量，自难忘。","千里孤坟，无处话凄凉。","纵使相逢应不识，尘满面，鬓如霜。","夜来幽梦忽还乡，小轩窗，正梳妆。","相顾无言，惟有泪千行。","料得年年肠断处，明月夜，短松冈。","似花还似非花，也无人惜从教坠。","抛家傍路，思量却是，无情有思。","萦损柔肠，困酣娇眼，欲开还闭。","梦随风万里，寻郎去处，又还被莺呼起。","不恨此花飞尽，恨西园，落红难缀。","晓来雨过，遗踪何在，一池萍碎。","春色三分，二分尘土，一分流水。","细看来，不是杨花，点点是离人泪。","楚天千里清秋，水随天去秋无际。","遥岑远目，献愁供恨，玉簪螺髻。","落日楼头，断鸿声里，江南游子。","把吴钩看了，栏杆拍遍，无人会，登临意。","休说鲈鱼堪脍，尽西风，季鹰归未。","求田问舍，怕应羞见，刘郎才气。","可惜流年，忧愁风雨，树犹如此。","倩何人唤取，红巾翠袖，揾英雄泪。","醉里挑灯看剑，梦回吹角连营。","八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。","马作的卢飞快，弓如霹雳弦惊。","了却君王天下事，赢得生前身后名。可怜白发生。","何处望神州。满眼风光北固楼。","千古兴亡多少事，悠悠。不尽长江滚滚流。","年少万兜鍪，坐断东南战未休。","天下英雄谁敌手，曹刘。生子当如孙仲谋。","千古江山，英雄无觅孙仲谋处。","舞榭歌台，风流总被雨打风吹去。","斜阳草树，寻常巷陌，人道寄奴曾住。","想当年，金戈铁马，气吞万里如虎。","元嘉草草，封狼居胥，赢得仓皇北顾。","四十三年，望中犹记，烽火扬州路。","可堪回首，佛狸祠下，一片神鸦社鼓。","凭谁问，廉颇老矣，尚能饭否。","我见青山多妩媚，料青山见我应如是。","情与貌，略相似。","一尊搔首东窗里。想渊明停云诗就，此时风味。","江左沉酣求名者，岂识浊醪妙理。","回首叫，云飞风起。","不恨古人吾不见，恨古人不见吾狂耳。","知我者，二三子。","少年不识愁滋味，爱上层楼。","爱上层楼，为赋新词强说愁。","而今识尽愁滋味，欲说还休。","欲说还休，却道天凉好个秋。","东风夜放花千树，更吹落星如雨。","宝马雕车香满路，凤箫声动，玉壶光转，一夜鱼龙舞。","蛾儿雪柳黄金缕，笑语盈盈暗香去。","众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。","更能消几番风雨，匆匆春又归去。","惜春长怕花开早，何况落红无数。","春且住。见说道，天涯芳草无归路。","怨春不语。算只有殷勤，画檐蛛网，尽日惹飞絮。","长门事，准拟佳期又误。蛾眉曾有人妒。","千金纵买相如赋，脉脉此情谁诉。","君莫舞。君不见，玉环飞燕皆尘土。","闲愁最苦。休去倚危栏，斜阳正在，烟柳断肠处。","过春社了，度帘幕中间，去年尘冷。","差池欲住，试入旧巢相并。","还相雕梁藻井。又软语商量不定。","飘然快拂花梢，翠尾分开红影。","芳径。芹泥雨润。爱贴地争飞，竞夸轻俊。","红楼归晚，看足柳昏花暝。","应自栖香正稳。便忘了天涯芳信。","愁损翠黛双蛾，日日画阑独凭。","芦叶满汀洲，寒沙带浅流。","二十年重过南楼。柳下系船犹未稳，能几日，又中秋。","黄鹤断矶头，故人今在否。旧江山浑是新愁。","欲买桂花同载酒，终不似，少年游。","燕雁无心，太湖西畔随云去。","数峰清苦。商略黄昏雨。","第四桥边，拟共天随住。","今何许。凭阑怀古。残柳参差舞。","淮左名都，竹西佳处，解鞍少驻初程。","过春风十里。尽荠麦青青。","自胡马窥江去后，废池乔木，犹厌言兵。","渐黄昏，清角吹寒。都在空城。","杜郎俊赏，算而今、重到须惊。","纵豆蔻词工，青楼梦好，难赋深情。","二十四桥仍在，波心荡、冷月无声。","念桥边红药，年年知为谁生。","忆昔午桥桥上饮，坐中多是豪英。","长沟流月去无声。杏花疏影里，吹笛到天明。","二十余年如一梦，此身虽在堪惊。","闲登小阁看新晴。古今多少事，渔唱起三更。","梦绕神州路。怅秋风、连营画角，故宫离黍。","底事昆仑倾砥柱，九地黄流乱注。聚万落千村狐兔。","天意从来高难问，况人情老易悲难诉。更南浦，送君去。","凉生岸柳催残暑。耿斜河，疏星淡月，断云微度。","万里江山知何处。回首对床夜语。雁不到，书成谁与。","目尽青天怀今古，肯儿曹恩怨相尔汝。举大白，听金缕。","雾失楼台，月迷津渡。桃源望断无寻处。","可堪孤馆闭春寒，杜鹃声里斜阳暮。","驿寄梅花，鱼传尺素。砌成此恨无重数。","郴江幸自绕郴山，为谁流下潇湘去。","纤云弄巧，飞星传恨，银汉迢迢暗度。","金风玉露一相逢，便胜却人间无数。","柔情似水，佳期如梦，忍顾鹊桥归路。","两情若是久长时，又岂在朝朝暮暮。","漠漠轻寒上小楼，晓阴无赖似穷秋。","淡烟流水画屏幽。","自在飞花轻似梦，无边丝雨细如愁。","宝帘闲挂小银钩。","山抹微云，天连衰草，画角声断谯门。","暂停征棹，聊共引离尊。","多少蓬莱旧事，空回首，烟霭纷纷。","斜阳外，寒鸦万点，流水绕孤村。","销魂。当此际，香囊暗解，罗带轻分。","谩赢得青楼，薄幸名存。","此去何时见也，襟袖上，空惹啼痕。","伤情处，高城望断，灯火已黄昏。","对潇潇暮雨洒江天，一番洗清秋。","渐霜风凄紧，关河冷落，残照当楼。","是处红衰翠减，苒苒物华休。","惟有长江水，无语东流。","不忍登高临远，望故乡渺邈，归思难收。","叹年来踪迹，何事苦淹留。","想佳人妆楼颙望，误几回、天际识归舟。","争知我，倚阑干处，正恁凝愁。","寒蝉凄切，对长亭晚，骤雨初歇。","都门帐饮无绪，留恋处，兰舟催发。","执手相看泪眼，竟无语凝噎。","念去去，千里烟波，暮霭沉沉楚天阔。","多情自古伤离别，更那堪，冷落清秋节。","今宵酒醒何处，杨柳岸，晓风残月。","此去经年，应是良辰好景虚设。","便纵有千种风情，更与何人说。","伫倚危楼风细细。望极春愁，黯黯生天际。","草色烟光残照里。无言谁会凭阑意。","拟把疏狂图一醉。对酒当歌，强乐还无味。","衣带渐宽终不悔。为伊消得人憔悴。","长安古道马迟迟。高柳乱蝉嘶。","夕阳岛外，秋风原上，目断四天垂。","归云一去无踪迹，何处是前期。","狎兴生疏，酒徒萧索，不似少年时。","碧云天，黄叶地，秋色连波，波上寒烟翠。","山映斜阳天接水，芳草无情，更在斜阳外。","黯乡魂，追旅思。夜夜除非，好梦留人睡。","明月楼高休独倚，酒入愁肠，化作相思泪。","塞下秋来风景异，衡阳雁去无留意。","四面边声连角起。千嶂里，长烟落日孤城闭。","浊酒一杯家万里，燕然未勒归无计。","羌管悠悠霜满地。人不寐，将军白发征夫泪。","登临送目。正故国晚秋，天气初肃。","千里澄江似练，翠峰如簇。","归帆去棹残阳里，背西风、酒旗斜矗。","彩舟云淡，星河鹭起，画图难足。","念往昔、繁华竞逐。叹门外楼头，悲恨相续。","千古凭高对此，谩嗟荣辱。","六朝旧事随流水，但寒烟衰草凝绿。","至今商女，时时犹唱，后庭遗曲。","一曲新词酒一杯，去年天气旧亭台。","夕阳西下几时回。","无可奈何花落去，似曾相识燕归来。","小园香径独徘徊。","槛菊愁烟兰泣露。罗幕轻寒，燕子双飞去。","明月不谙离恨苦。斜光到晓穿朱户。","昨夜西风凋碧树。独上高楼，望尽天涯路。","欲寄彩笺兼尺素。山长水阔知何处。","小径红稀，芳郊绿遍。高台树色阴阴见。","春风不解禁杨花，蒙蒙乱扑行人面。","翠叶藏莺，朱帘隔燕。炉香静逐游丝转。","一场愁梦酒醒时，斜阳却照深深院。","梦后楼台高锁，酒醒帘幕低垂。","去年春恨却来时。落花人独立，微雨燕双飞。","记得小苹初见，两重心字罗衣。","琵琶弦上说相思。当时明月在，曾照彩云归。","西城杨柳弄春柔。动离忧。泪难收。","犹记多情，曾为系归舟。","碧野朱桥当日事，人不见，水空流。","韶华不为少年留。恨悠悠。几时休。","飞絮落花时候一登楼。","便做春江都是泪，流不尽，许多愁。   function getDayIndex(len) {
    if (!len) return -1;
    // 以 1970-01-01 起的天数为种子，每天按顺序下一条，循环展示
    var days = Math.floor(Date.now() / 86400000);
    return days % len;
  }
  function renderDailyTip() {
    var idx = getDayIndex(TIPS.length);
    if (idx < 0) return;
    var textEl = document.getElementById('tipText');
    if (!textEl) return;
    textEl.textContent = TIPS[idx];
  }
  function renderDailyPoem() {
    var idx = getDayIndex(POEMS.length);
    if (idx < 0) return;
    var textEl = document.getElementById('poemText');
    if (!textEl) return;
    textEl.textContent = POEMS[idx];
  }

  // ========== 工具函数 ==========
  function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

  function getTodayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function getYesterdayStr() {
    var d = new Date(); d.setDate(d.getDate()-1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function formatTime(ts) {
    var d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function formatDateCN() {
    var d = new Date();
    var months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    var days = ['日','一','二','三','四','五','六'];
    return months[d.getMonth()] + d.getDate() + '日 周' + days[d.getDay()];
  }

  function getGrowthPoints() { return state.totalEarned - state.totalRedeemed; }
  function getAvailablePoints() { return state.totalEarned - state.totalRedeemed; }

  function getStageIndex() {
    var gp = getGrowthPoints();
    for (var i = STAGES.length - 1; i >= 0; i--) {
      if (gp >= STAGES[i].threshold) return i;
    }
    return 0;
  }

  function getStageProgress() {
    var gp = getGrowthPoints();
    var idx = getStageIndex();
    var stage = STAGES[idx];
    if (idx >= STAGES.length - 1) return { progress: 1, current: gp, needed: 0, isMax: true };
    var base = stage.threshold;
    var next = STAGES[idx + 1].threshold;
    var range = next - base;
    var progress = (gp - base) / range;
    return { progress: Math.min(progress, 1), current: gp, needed: next, isMax: false };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state = JSON.parse(raw);
        // 兼容性检查
        if (!state.tasks) state.tasks = [];
        if (!state.wishes) state.wishes = [];
        if (!state.history) state.history = [];
        if (state.totalEarned == null) state.totalEarned = 0;
        if (state.totalRedeemed == null) state.totalRedeemed = 0;
        if (state.streak == null) state.streak = 0;
        if (state.lastActiveDate == null) state.lastActiveDate = null;
      } else {
        state = defaultState();
        saveState();
      }
    } catch(e) {
      state = defaultState();
    }
    checkStreak();
  }

  function checkStreak() {
    var today = getTodayStr();
    var yesterday = getYesterdayStr();
    if (state.lastActiveDate === today) {
      // 今天已完成过任务，不重置
    } else if (state.lastActiveDate === yesterday) {
      // 昨天有完成，streak保持
    } else {
      // 断了
      state.streak = 0;
    }
    saveState();
  }

  // ========== 历史 ==========
  function addHistory(type, desc, points) {
    state.history.unshift({
      id: gid(),
      ts: Date.now(),
      type: type,
      desc: desc,
      points: points
    });
    if (state.history.length > 200) state.history = state.history.slice(0, 200);
  }

  // ========== 树图片生成 ==========
  function getTreeImage(stageIdx, progress) {
    var src = TREE_IMAGES[stageIdx] || TREE_IMAGES[0];
    // 根据阶段内进度做轻微缩放，营造持续成长感
    var scale = 0.88 + progress * 0.12;
    return '<img src="' + src + '" alt="' + STAGES[stageIdx].name + '" ' +
           'style="transform:scale(' + scale.toFixed(3) + ')" draggable="false">';
  }

  // ========== 渲染 ==========
  function renderAll() {
    renderTree();
    renderStats();
    renderRoadmap();
    renderTasks();
    renderWishes();
    renderHistory();
    renderCalendar();
    renderHeader();
  }

  function renderHeader() {
    document.getElementById('dateText').textContent = formatDateCN();
    document.getElementById('streakNum').textContent = state.streak;
  }

  function renderTree() {
    var idx = getStageIndex();
    var sp = getStageProgress();
    var img = getTreeImage(idx, sp.progress);
    document.getElementById('treeSvgWrap').innerHTML = img;

    var stage = STAGES[idx];
    document.getElementById('stageEmoji').textContent = stage.emoji;
    document.getElementById('stageName').textContent = stage.name;
    document.getElementById('stageLevel').textContent = '阶段 ' + (idx+1) + '/10';
    document.getElementById('progressFill').style.width = (sp.progress * 100) + '%';
    document.getElementById('progressCurrent').textContent = sp.current + ' 成长值';

    if (sp.isMax) {
      document.getElementById('progressNext').textContent = '🎉 已达最高阶段';
    } else {
      document.getElementById('progressNext').textContent = '下一阶段: ' + STAGES[idx+1].name + ' (' + sp.needed + ')';
    }
  }

  function renderStats() {
    animateNumber('growthValue', getGrowthPoints());
    animateNumber('availableValue', getAvailablePoints());
    animateNumber('totalValue', state.totalEarned);
  }

  function animateNumber(id, target) {
    var el = document.getElementById(id);
    if (!el) return;
    var from = parseInt(el.dataset.v || '0', 10);
    if (from === target) { el.textContent = target; return; }
    el.dataset.v = target;
    if (numTimers[id]) clearInterval(numTimers[id]);
    var start = null;
    var dur = 600;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (target - from) * eased);
      if (p < 1) {
        numTimers[id] = requestAnimationFrame(step);
      } else {
        el.textContent = target;
      }
    }
    numTimers[id] = requestAnimationFrame(step);
    // 弹跳效果
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function renderRoadmap() {
    var idx = getStageIndex();
    var html = '';
    for (var i = 0; i < STAGES.length; i++) {
      var st = STAGES[i];
      var cls = '';
      if (i < idx) cls = 'completed';
      else if (i === idx) cls = 'current';
      else cls = 'locked';
      var emoji = i <= idx ? st.emoji : '🔒';
      html += '<div class="roadmap-stage ' + cls + '">';
      html += '<span class="rm-emoji">' + emoji + '</span>';
      html += '<span class="rm-name">' + st.name + '</span>';
      html += '<span class="rm-points">' + st.threshold + '</span>';
      html += '</div>';
    }
    document.getElementById('roadmapTrack').innerHTML = html;
    // 滚动到当前阶段
    var track = document.getElementById('roadmapTrack');
    var current = track.children[idx];
    if (current) {
      track.scrollLeft = current.offsetLeft - track.offsetWidth/2 + current.offsetWidth/2;
    }
  }

  function renderTasks() {
    var list = document.getElementById('taskList');
    var pending = state.tasks.filter(function(t){ return !t.completed; });
    var done = state.tasks.filter(function(t){ return t.completed; });

    document.getElementById('taskBadge').textContent = pending.length;

    if (state.tasks.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="emoji">📝</div><div class="text">还没有任务，点击右上角添加吧</div></div>';
      return;
    }

    var html = '';
    // 未完成在前
    for (var i = 0; i < pending.length; i++) html += taskItemHTML(pending[i]);
    for (var j = 0; j < done.length; j++) html += taskItemHTML(done[j]);

    list.innerHTML = html;

    // 绑定事件
    var items = list.querySelectorAll('.task-item');
    for (var k = 0; k < items.length; k++) {
      (function(item) {
        var id = item.dataset.id;
        item.querySelector('.task-check').addEventListener('click', function() { toggleTask(id, item); });
        item.querySelector('.task-delete').addEventListener('click', function(e) {
          e.stopPropagation();
          deleteTask(id);
        });
      })(items[k]);
    }
  }

    var cat = CATEGORIES.find(function(c){ return c.id === t.category; }) || CATEGORIES[CATEGORIES.length - 1];
    return '<div class="task-item' + (t.completed ? ' completed' : '') + '" data-id="' + t.id + '">' +
      '<div class="task-check' + (t.completed ? ' checked' : '') + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
      '</div>' +
      '<span class="task-cat-icon">' + cat.emoji + '</span>' +
      '<div class="task-info">' +
        '<div class="task-name">' + esc(t.name) + '</div>' +
        '<div class="task-meta">' + cat.name + '</div>' +
      '</div>' +
      '<span class="task-points">+' + t.points + '</span>' +
      (t.completed ? '' : '<button class="task-delete">✕</button>') +
    '</div>';
  }

    var avail = state.wishes.filter(function(w){ return !w.redeemed; });
    var redeemed = state.wishes.filter(function(w){ return w.redeemed; });

    document.getElementById('wishBadge').textContent = avail.length;

    if (state.wishes.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="emoji">🎁</div><div class="text">还没有愿望，添加一个吧</div></div>';
    } else {
      var html = '';
      for (var i = 0; i < avail.length; i++) html += wishItemHTML(avail[i]);
      list.innerHTML = html;

      var items = list.querySelectorAll('.wish-item');
      for (var k = 0; k < items.length; k++) {
        (function(item) {
          var id = item.dataset.id;
          var btn = item.querySelector('.wish-redeem');

            btn.addEventListener('click', function() { tryRedeem(id); });

          '<div class="wish-info">' +
            '<div class="wish-name">' + esc(w.name) + '</div>' +
            '<div class="redeemed-time">' + (w.redeemedAt ? new Date(w.redeemedAt).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '') + '</div>' +

        '<div class="wish-cost">消耗 ' + w.cost + ' 积分</div>' +
      '</div>' +
      '<button class="wish-redeem' + (can ? '' : ' disabled') + '">' + (can ? '兑换' : '不足') + '</button>' +

  function renderHistory() {
    var list = document.getElementById('historyList');
    if (state.history.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="emoji">📖</div><div class="text">还没有成长记录</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < state.history.length; i++) {
      var h = state.history[i];
      var iconCls = 'task', iconStr = '✓';
      if (h.type === 'wish') { iconCls = 'wish'; iconStr = '🎁'; }
      else if (h.type === 'add_task') { iconCls = 'add'; iconStr = '＋'; }
      else if (h.type === 'add_wish') { iconCls = 'add'; iconStr = '＋'; }
      else if (h.type === 'delete') { iconCls = 'delete'; iconStr = '✕'; }
      else if (h.type === 'uncomplete') { iconCls = 'delete'; iconStr = '↩'; }

      var ptCls = h.points > 0 ? 'plus' : 'minus';
      var ptStr = h.points > 0 ? ('+' + h.points) : ('' + h.points);
      if (h.points === 0) { ptCls = ''; ptStr = ''; }

      html += '<div class="history-item">' +
        '<div class="history-icon ' + iconCls + '">' + iconStr + '</div>' +
        '<div class="history-info">' +
          '<div class="history-desc">' + esc(h.desc) + '</div>' +
          '<div class="history-time">' + formatTime(h.ts) + '</div>' +
        '</div>' +
        (ptStr ? '<span class="history-points ' + ptCls + '">' + ptStr + '</span>' : '') +
      '</div>';
    }
    list.innerHTML = html;
  }

  // ========== 日历 ==========
  function dateKeyOf(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // 按日期聚合每日净积分（来自成长记录）
  function getDailyPointsMap() {
    var map = {};
    state.history.forEach(function(h) {
      if (!h.ts) return;
      var key = dateKeyOf(h.ts);
      map[key] = (map[key] || 0) + (h.points || 0);
    });
    return map;
  }

  function renderCalendar() {
    var title = document.getElementById('calendarTitle');
    title.textContent = calYear + '年' + (calMonth + 1) + '月';

    var dailyMap = getDailyPointsMap();
    var grid = document.getElementById('calendarGrid');
    var todayKey = getTodayStr();

    var firstDow = new Date(calYear, calMonth, 1).getDay(); // 0=周日
    var offset = (firstDow + 6) % 7; // 周一为一周开始
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

    var html = '';
    for (var i = 0; i < offset; i++) html += '<div class="cal-cell cal-empty"></div>';

    for (var d = 1; d <= daysInMonth; d++) {
      var key = calYear + '-' + String(calMonth + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var pts = dailyMap[key] || 0;
      var cls = 'cal-cell';
      if (key === todayKey) cls += ' cal-today';
      var ptHtml = '';
      if (pts > 0) ptHtml = '<span class="cal-pts cal-plus">+' + pts + '</span>';
      else if (pts < 0) ptHtml = '<span class="cal-pts cal-minus">' + pts + '</span>';
      else if (dailyMap[key] !== undefined) ptHtml = '<span class="cal-pts cal-zero">0</span>';

      var delay = Math.min((offset + d - 1) * 18, 500);
      html += '<div class="' + cls + '" data-key="' + key + '" style="animation-delay:' + delay + 'ms">' +
        '<span class="cal-day">' + d + '</span>' + ptHtml +
      '</div>';
    }
    grid.innerHTML = html;

    var cells = grid.querySelectorAll('.cal-cell[data-key]');
    for (var k = 0; k < cells.length; k++) {
      cells[k].addEventListener('click', function() {
        var prev = grid.querySelector('.cal-selected');
        if (prev) prev.classList.remove('cal-selected');
        this.classList.add('cal-selected');
        showDailyDetail(this.dataset.key);
      });
    }
  }

  function showDailyDetail(key) {
    var detail = document.getElementById('calendarDetail');
    var records = state.history.filter(function(h) {
      return h.ts && dateKeyOf(h.ts) === key;
    });

    var title = key;
    if (key === getTodayStr()) title += '（今天）';

    if (records.length === 0) {
      detail.innerHTML = '<div class="cal-detail-title">' + title + ' · 积分明细</div>' +
        '<div class="empty-state" style="padding:18px"><div class="emoji">📭</div><div class="text">这一天还没有积分记录</div></div>';
      return;
    }

    var total = 0;
    var html = '<div class="cal-detail-title">' + title + ' · 积分明细</div>';
    for (var i = 0; i < records.length; i++) {
      var h = records[i];
      total += (h.points || 0);
      var icon = '✓', iconCls = 'task';
      if (h.type === 'wish') { icon = '🎁'; iconCls = 'wish'; }
      else if (h.type === 'add_task' || h.type === 'add_wish') { icon = '＋'; iconCls = 'add'; }
      else if (h.type === 'delete') { icon = '✕'; iconCls = 'delete'; }
      else if (h.type === 'uncomplete') { icon = '↩'; iconCls = 'delete'; }
      var ptCls = h.points > 0 ? 'plus' : (h.points < 0 ? 'minus' : '');
      var ptStr = h.points > 0 ? ('+' + h.points) : (h.points < 0 ? ('' + h.points) : '');
      html += '<div class="history-item">' +
        '<div class="history-icon ' + iconCls + '">' + icon + '</div>' +
        '<div class="history-info">' +
          '<div class="history-desc">' + esc(h.desc) + '</div>' +
          '<div class="history-time">' + formatTime(h.ts) + '</div>' +
        '</div>' +
        (ptStr ? '<span class="history-points ' + ptCls + '">' + ptStr + '</span>' : '') +
      '</div>';
    }
    var totalCls = total > 0 ? 'cal-plus' : (total < 0 ? 'cal-minus' : 'cal-zero');
    html += '<div class="cal-detail-total">当日合计: <b class="' + totalCls + '">' + (total > 0 ? '+' : '') + total + '</b></div>';
    detail.innerHTML = html;
  }

  function setupCalendar() {
    document.getElementById('prevMonth').addEventListener('click', function() {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    });
    document.getElementById('nextMonth').addEventListener('click', function() {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    });
  }

  // ========== 动作 ==========
  function toggleTask(id, itemEl) {
    var task = state.tasks.find(function(t){ return t.id === id; });
    if (!task) return;

    var wasCompleted = task.completed;
    task.completed = !task.completed;

    if (task.completed) {
      state.totalEarned += task.points;
      addHistory('task', '完成「' + task.name + '」', task.points);
      // 浮动积分
      if (itemEl) showFloatPoints(itemEl, '+' + task.points);
      // streak
      var today = getTodayStr();
      if (state.lastActiveDate !== today) {
        var yesterday = getYesterdayStr();
        if (state.lastActiveDate === yesterday) {
          state.streak += 1;
        } else {
          state.streak = 1;
        }
        state.lastActiveDate = today;
      }
    } else {
      state.totalEarned -= task.points;
      if (state.totalEarned < 0) state.totalEarned = 0;
      addHistory('uncomplete', '取消完成「' + task.name + '」', -task.points);
    }

    var prevStage = getStageIndex();
    saveState();
    var newStage = getStageIndex();

    renderAll();

    if (!wasCompleted && newStage > prevStage) {
      celebrate(newStage);
    }
  }

  function deleteTask(id) {
    var task = state.tasks.find(function(t){ return t.id === id; });
    if (!task) return;
    if (task.completed) {
      showToast('已完成任务不可删除');
      return;
    }
    state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
    addHistory('delete', '删除任务「' + task.name + '」', 0);
    saveState();
    renderAll();
    showToast('已删除');
  }

  function tryRedeem(id) {
    var wish = state.wishes.find(function(w){ return w.id === id; });
    if (!wish || wish.redeemed) return;
    if (getAvailablePoints() < wish.cost) {
      showToast('积分不足，继续完成任务吧');
      return;
    }
    // 确认弹窗
    document.getElementById('confirmTitle').textContent = '确认兑换';
    document.getElementById('confirmMsg').innerHTML =
      '兑换「' + esc(wish.name) + '」将消耗 <b style="color:#F06292">' + wish.cost + '</b> 积分。<br>' +
      '小树苗成长值将减少，请确认。';
    showConfirm(function() {
      wish.redeemed = true;
      wish.redeemedAt = Date.now();
      state.totalRedeemed += wish.cost;
      addHistory('wish', '兑换愿望「' + wish.name + '」', -wish.cost);
      var prevStage = getStageIndex();
      saveState();
      renderAll();
      var newStage = getStageIndex();
      showToast('🎉 兑换成功！');
      if (newStage < prevStage) {
        showToast('小树成长值减少，降至「' + STAGES[newStage].name + '」阶段');
      }
    });
  }

  function deleteWish(id) {
    var wish = state.wishes.find(function(w){ return w.id === id; });
    if (!wish) return;
    state.wishes = state.wishes.filter(function(w){ return w.id !== id; });
    addHistory('delete', '删除愿望「' + wish.name + '」', 0);
    saveState();
    renderAll();
    showToast('已删除');
  }

  // ========== 模态框 ==========
  function openModal(id) { document.getElementById(id).classList.add('show'); }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  function buildCategoryPicker() {
    var picker = document.getElementById('catPicker');
    var html = '';
    for (var i = 0; i < CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      html += '<button class="cat-btn' + (c.id === selectedCategory ? ' active' : '') + '" data-cat="' + c.id + '">' + c.emoji + ' ' + c.name + '</button>';
    }
    picker.innerHTML = html;
    var btns = picker.querySelectorAll('.cat-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function() {
        var btns2 = picker.querySelectorAll('.cat-btn');
        for (var j = 0; j < btns2.length; j++) btns2[j].classList.remove('active');
        this.classList.add('active');
        selectedCategory = this.dataset.cat;
      });
    }
  }

  function setupTaskModal() {
    document.getElementById('openAddTask').addEventListener('click', function() {
      document.getElementById('taskNameInput').value = '';
      document.getElementById('taskPtInput').value = '10';
      selectedCategory = 'chinese';
      buildCategoryPicker();
      // reset quick points
      var qps = document.querySelectorAll('#addTaskModal .quick-pt');
      for (var i = 0; i < qps.length; i++) qps[i].classList.remove('active');
      var tenBtn = document.querySelector('#addTaskModal .quick-pt[data-pt="10"]');
      if (tenBtn) tenBtn.classList.add('active');
      openModal('addTaskModal');
      setTimeout(function() { document.getElementById('taskNameInput').focus(); }, 300);
    });

    document.getElementById('cancelTask').addEventListener('click', function() { closeModal('addTaskModal'); });
    document.getElementById('confirmTask').addEventListener('click', function() {
      var name = document.getElementById('taskNameInput').value.trim();
      var pts = parseInt(document.getElementById('taskPtInput').value) || 10;
      if (!name) { showToast('请输入任务名称'); return; }
      if (pts < 1) pts = 1; if (pts > 100) pts = 100;
      var task = { id: gid(), name: name, points: pts, category: selectedCategory, completed: false };
      state.tasks.push(task);
      addHistory('add_task', '添加任务「' + name + '」', 0);
      saveState();
      renderAll();
      closeModal('addTaskModal');
      showToast('任务已添加');

      var v = parseInt(document.getElementById('taskPtInput').value) || 10;
      if (v > 1) document.getElementById('taskPtInput').value = v - 1;
    });
    document.getElementById('taskPtInc').addEventListener('click', function() {
      var v = parseInt(document.getElementById('taskPtInput').value) || 10;
      if (v < 100) document.getElementById('taskPtInput').value = v + 1;
    });

    // 快捷积分
    var qps = document.querySelectorAll('#addTaskModal .quick-pt');
    for (var i = 0; i < qps.length; i++) {
      qps[i].addEventListener('click', function() {
        for (var j = 0; j < qps.length; j++) qps[j].classList.remove('active');
        this.classList.add('active');
        document.getElementById('taskPtInput').value = this.dataset.pt;
      });

  // ========== Tab ==========
  function setupTabs() {
    var btns = document.querySelectorAll('.tab-btn');
    var panels = document.querySelectorAll('.tab-panel');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function() {

        if (panel) panel.classList.add('active');

  // ========== 确认弹窗 ==========
  function showConfirm(callback) {
    confirmCallback = callback;
    document.getElementById('confirmDialog').classList.add('show');
  }
  function setupConfirm() {
    document.getElementById('confirmNo').addEventListener('click', function() {
      document.getElementById('confirmDialog').classList.remove('show');
      confirmCallback = null;
    });
    document.getElementById('confirmYes').addEventListener('click', function() {
      document.getElementById('confirmDialog').classList.remove('show');
      if (confirmCallback) confirmCallback();
      confirmCallback = null;

  // ========== 庆祝 ==========
  function celebrate(newStage) {
    var stage = STAGES[newStage];
    document.getElementById('celeEmoji').textContent = stage.emoji;
    document.getElementById('celeTitle').textContent = '小树成长了！';
    var msgs = [
      '恭喜！你的小树成长为「' + stage.name + '」！',
      '阶段 ' + (newStage+1) + '/10 — 继续加油，向着参天大树前进！'
    ];
    document.getElementById('celeMsg').innerHTML = msgs.join('<br>');
    document.getElementById('celebration').classList.add('show');
    spawnConfetti();
  }

  function spawnConfetti() {
    var colors = ['#F48FB1','#EC6EA0','#CE93D8','#F8BBD0','#FF8A80','#F06292'];
    for (var i = 0; i < 30; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      piece.style.width = (6 + Math.random() * 6) + 'px';
      piece.style.height = (6 + Math.random() * 6) + 'px';
      document.body.appendChild(piece);
      (function(p) {
        setTimeout(function() { p.remove(); }, 3500);
      })(piece);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('celeBtn').addEventListener('click', function() {
      document.getElementById('celebration').classList.remove('show');
    });
  });

  // ========== 浮动积分 ==========
  function showFloatPoints(itemEl, text) {
    var rect = itemEl.getBoundingClientRect();
    var appRect = document.getElementById('app').getBoundingClientRect();
    var el = document.createElement('div');
    el.className = 'float-points';
    el.textContent = text;
    el.style.left = (rect.left - appRect.left + rect.width/2 - 15) + 'px';
    el.style.top = (rect.top - appRect.top) + 'px';
    document.getElementById('app').appendChild(el);
    setTimeout(function() { el.remove(); }, 1200);
  }

  // ========== Toast ==========
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  // ========== 清空历史 / 重置所有数据 ==========
  document.addEventListener('DOMContentLoaded', function() {
    var clearBtn = document.getElementById('clearHistory');
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        document.getElementById('confirmTitle').textContent = '清空记录';
        document.getElementById('confirmMsg').textContent = '确定清空所有成长历程记录吗？';
        showConfirm(function() {
          state.history = [];
          saveState();
          renderAll();
          showToast('已清空记录');
        });
      });
    }
    var resetBtn = document.getElementById('resetAll');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        document.getElementById('confirmTitle').textContent = '重置所有数据';
        document.getElementById('confirmMsg').innerHTML = '将清空任务、愿望、积分和成长记录等全部数据，小树将从种子重新开始。<br><b>此操作不可恢复</b>，确定重置吗？';
        showConfirm(function() {
          state = defaultState();
          saveState();
          renderAll();
          showToast('已重置所有数据');
        });
      });
    }
  });

  // ========== HTML 转义 ==========
  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ========== 模态框点击外部关闭 ==========
  document.addEventListener('DOMContentLoaded', function() {
    var modals = document.querySelectorAll('.modal-overlay');
    for (var i = 0; i < modals.length; i++) {
      modals[i].addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('show');
      });
    }
  });

  // ========== 初始化 ==========
  // ========== 飘落樱花 ==========
  var PETAL_EMOJIS = ['🌸', '🌷', '❀', '🌸', '💗'];
  function spawnPetal() {
    var layer = document.getElementById('petalLayer');
    if (!layer) return;
    if (layer.children.length > 14) return; // 限制数量
    var p = document.createElement('span');
    p.className = 'petal';
    p.textContent = PETAL_EMOJIS[Math.floor(Math.random() * PETAL_EMOJIS.length)];
    p.style.left = (Math.random() * 100) + '%';
    p.style.fontSize = (10 + Math.random() * 10) + 'px';
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.animationDelay = (Math.random() * 1) + 's';
    layer.appendChild(p);
    setTimeout(function() { p.remove(); }, 14000);
  }
  function startPetals() {
    // 初始先铺几片
    for (var i = 0; i < 5; i++) setTimeout(spawnPetal, i * 700);
    setInterval(spawnPetal, 1600);
  }

  function init() {
    loadState();
    setupTabs();
    setupTaskModal();
    setupWishModal();
    setupConfirm();
    setupCalendar();
    startPetals();
    renderDailyTip();
    renderDailyPoem();
    renderAll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
